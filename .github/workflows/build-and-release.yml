name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.0"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release binary
        run: swift build -c release

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail

          BIN_PATH="$(swift build -c release --show-bin-path)"
          APP_DIR="$RUNNER_TEMP/Depthly.app"
          CONTENTS_DIR="$APP_DIR/Contents"
          MACOS_DIR="$CONTENTS_DIR/MacOS"
          RESOURCES_DIR="$CONTENTS_DIR/Resources"
          PLIST_FILE="$CONTENTS_DIR/Info.plist"

          rm -rf "$APP_DIR"
          mkdir -p "$MACOS_DIR" "$RESOURCES_DIR"

          cp "$BIN_PATH/DepthlyApp" "$MACOS_DIR/DepthlyApp"
          chmod +x "$MACOS_DIR/DepthlyApp"

          cat > "$PLIST_FILE" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>DepthlyApp</string>
              <key>CFBundleIdentifier</key>
              <string>com.depthly.app</string>
              <key>CFBundleName</key>
              <string>Depthly</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundleVersion</key>
              <string>${GITHUB_RUN_NUMBER}</string>
              <key>LSMinimumSystemVersion</key>
              <string>15.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP_DIR"

          ZIP_PATH="$RUNNER_TEMP/Depthly-macos-arm64-${GITHUB_SHA::7}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "$ZIP_PATH"

          TAG_NAME="nightly-${GITHUB_RUN_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG_NAME" --force

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Nightly build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: ${{ env.ZIP_PATH }}
